<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel del personal · Catálogo</title>
  <link rel="stylesheet" href="/personal.css">
</head>
<body>
  <header class="topbar"><strong>Panel del personal</strong><a href="/">Ver chat público ↗</a></header>
  <main>
    <section id="login-panel" class="card narrow">
      <p class="eyebrow">Acceso interno</p><h1>Iniciar sesión</h1>
      <p>Ingresa con una cuenta de agente o administrador.</p>
      <form id="login-form">
        <label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button>Entrar</button>
      </form>
    </section>
    <div id="workspace" hidden>
      <div class="intro"><div><p class="eyebrow">Administración del catálogo</p><h1>Captura de datos</h1><p>Los registros activos y disponibles alimentan las respuestas del chat.</p></div><button id="logout" class="secondary">Cerrar sesión</button></div>
      <nav class="tabs" aria-label="Secciones"><button data-tab="developments" class="active">Desarrollos</button><button data-tab="properties">Propiedades</button><button data-tab="faqs">Preguntas frecuentes</button></nav>
      <div class="grid"><section class="card"><h2 id="form-title"></h2><form id="record-form"></form></section><section class="card"><h2>Registros</h2><div id="records"></div></section></div>
    </div>
    <p id="feedback" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/personal.js"></script>
</body>
</html>
